/* Checkout: server recomputes price/stock/coupon; validates ALL lines first, then decrements all-or-nothing. In SQL: UPDATE variants SET stock=stock-:q WHERE sku=:s AND stock>=:q inside one transaction (0 rows => abort). */

[...new Set(lines.map(l=>l.p.brandId))].forEach(bid=>{const ls=lines.filter(l=>l.p.brandId==bid),sub=ls.reduce((a,l)=>a+pr(l.p)*l.qty,0),disc=Math.round(sub*(cp&&(cp.brandId=='*'||cp.brandId==bid)?cp.pct/100:0)),id=++S.seq;

function bimg(key,files,bid){const f=files[0],bad=()=>toast(t('Image upload failed','فشل رفع الصورة'));if(!f||!f.type.startsWith('image/'))return bad();bid=bid||U().brandId;const r=new FileReader();r.onerror=bad;r.onload=()=>{const im=new Image();im.onerror=bad;im.onload=()=>{const m=key=='logo'?300:1200,k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);run(()=>api.saveBrand(bid,{[key]:c.toDataURL('image/jpeg',.8)}),t('Image saved','تم حفظ الصورة'))};im.src=r.result};r.readAsDataURL(f)}

const AREAS=[['Nasr City','مدينة نصر',30.0561,31.3301],['Maadi','المعادي',29.9602,31.2569],['Heliopolis','مصر الجديدة',30.0911,31.3225],['Downtown','وسط البلد',30.0444,31.2357],['Zamalek','الزمالك',30.0609,31.2197],['Dokki / Giza','الدقي / الجيزة',30.0388,31.2121],['Shubra','شبرا',30.1128,31.2456],['New Cairo','القاهرة الجديدة',30.0074,31.4913],['Sheikh Zayed','الشيخ زايد',30.0131,30.9808],['6th of October','6 أكتوبر',29.9285,30.9188]];
const mx=g=>20+(g-30.85)/.7*260,my=a=>200-(a-29.88)/.27*180,near=(a,g)=>AREAS.map(r=>[r,Math.hypot(r[2]-a,r[3]-g)]).sort((x,y)=>x[1]-y[1])[0];
const locChip=()=>`<button class="btn o s lc" onclick="locPick()" style="max-width:150px"><i data-lucide="map-pin"></i><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${E(S.loc?S.loc.name:t('Set location','حدد الموقع'))}</span></button>`;
function setLoc(name,lat,lng){S.loc={name,lat,lng};save();closeM();toast(t('Delivery location saved','تم حفظ موقع التوصيل'));render()}
let LM={};
const mapSrc=()=>'https://www.google.com/maps?q='+encodeURIComponent(LM.lat!=null?LM.lat+','+LM.lng:LM.q||'Cairo, Egypt')+'&z='+(LM.lat!=null?16:11)+'&output=embed&hl='+S.lang;
function locPick(first){const L=S.loc;LM={first,simple:0,q:L&&L.lat==null?L.name:'',lat:L?.lat??null,lng:L?.lng??null,name:L?.name||''};locDraw()}
function simpleMap(){const L=LM;return `<svg id=lmap viewBox="0 0 300 220" style="width:100%;background:var(--ps);border-radius:10px;cursor:crosshair" onclick="locMap(event)"><polyline points="${[[30.15,31.28],[30.1,31.25],[30.05,31.23],[30,31.23],[29.95,31.25],[29.88,31.28]].map(p=>mx(p[1])+','+my(p[0])).join(' ')}" fill="none" stroke="#93c5fd" stroke-width="7" opacity=".7"/>${AREAS.map(r=>`<circle cx="${mx(r[3])}" cy="${my(r[2])}" r="4" style="fill:var(--p)" opacity=".55"/><text x="${mx(r[3])+6}" y="${my(r[2])+3}" font-size="8" style="fill:var(--t)">${S.lang=='ar'?r[1]:r[0]}</text>`).join('')}${L.lat!=null?`<circle cx="${mx(L.lng)}" cy="${my(L.lat)}" r="7" fill="#dc2626" stroke="#fff" stroke-width="2"/>`:''}</svg><div class=chips style="margin:8px 0">${AREAS.map(r=>`<span class=chip onclick="setLoc('${r[S.lang=='ar'?1:0]}',${r[2]},${r[3]})">${S.lang=='ar'?r[1]:r[0]}</span>`).join('')}</div>`}
function locDraw(){const L=S.loc;modal(`<div style="max-width:460px;margin:0 auto"><h2>${I('map-pin')} ${t('Choose your delivery location','اختر موقع التوصيل')}</h2>
${LM.simple?simpleMap():`<iframe id=gm title="Google Maps" src="${mapSrc()}" style="width:100%;height:270px;border:0;border-radius:10px;background:var(--ps)" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe>`}
<button class=btn style="width:100%;justify-content:center;margin-top:10px" onclick="locGeo()">${I('locate-fixed')}${t('Use my current location','استخدم موقعي الحالي')}</button>
<div class=row style="margin:10px 0"><input id=lt value="${E(LM.q)}" placeholder="${t('Search an address or place','ابحث عن عنوان أو مكان')}" style="flex:1" onkeydown="event.key=='Enter'&&locSearch()"><button class="btn o" onclick="locSearch()">${I('search')}</button></div>
${LM.name&&!LM.simple?`<p class=m>${I('map-pin')} ${E(LM.name)}</p>`:''}
<div class=row><button class=btn onclick="locOk()">${I('check')}${t('Confirm location','تأكيد الموقع')}</button>${LM.lat!=null?`<a class="btn g s" target=_blank rel=noopener href="https://www.google.com/maps?q=${LM.lat},${LM.lng}">${I('external-link')}Google Maps</a>`:''}<button class="btn g s" onclick="LM.simple=!LM.simple;locDraw()">${LM.simple?t('Back to Google Maps','رجوع لخرائط جوجل'):t('Map not showing? Simple map','الخريطة لا تظهر؟ خريطة مبسطة')}</button><button class="btn g s" onclick=closeM()>${LM.first?(L?t('Keep current','أبقِ الحالي'):t('Skip','تخطي')):t('Close','إغلاق')}</button></div></div>`)}
function locSearch(){const q=$('#lt').value.trim();if(!q)return toast(t('Type an address or place','اكتب عنوانًا أو مكانًا'));LM.q=q;LM.lat=LM.lng=null;LM.name=q;LM.simple=0;locDraw()}
function locOk(){const n=LM.name||LM.q;if(!n)return toast(t('Search a place or use your current location first','ابحث عن مكان أو استخدم موقعك الحالي أولًا'));setLoc(n,LM.lat,LM.lng)}
function locMap(e){const r=$('#lmap').getBoundingClientRect(),x=(e.clientX-r.left)/r.width*300,y=(e.clientY-r.top)/r.height*220,g=30.85+(x-20)/260*.7,a=29.88+(200-y)/180*.27,n=near(a,g)[0];setLoc(t('Near ','بالقرب من ')+(S.lang=='ar'?n[1]:n[0]),+a.toFixed(5),+g.toFixed(5))}
function locGeo(){if(!navigator.geolocation)return toast(t('Location is not supported here','الموقع غير مدعوم'));toast(t('Getting your location…','جاري تحديد موقعك…'));
navigator.geolocation.getCurrentPosition(p=>{const a=p.coords.latitude,g=p.coords.longitude,n=near(a,g);LM.lat=+a.toFixed(5);LM.lng=+g.toFixed(5);LM.q='';LM.simple=0;LM.name=t('My current location','موقعي الحالي')+(n[1]<.3?' – '+(S.lang=='ar'?n[0][1]:n[0][0]):'');locDraw()},()=>toast(t('Could not get your location (permission denied or blocked). Search for it instead.','تعذر تحديد موقعك (تم الرفض أو الحجب). ابحث عنه بدلًا من ذلك.')),{enableHighAccuracy:true,timeout:10000})}

function mkp(bid,id,name,c,price,disc,fit,cols,sz,off){const p={id,brandId:bid,name,cat:c,desc:'Premium quality '+name.toLowerCase()+' with a '+fit.toLowerCase()+' cut. Soft, durable fabric.',price,disc,fit,images:[],date:Date.now()-off*864e5,colors:cols.map(x=>({n:x[0],hex:x[1]})),sizes:sz.map((s,i)=>({s,fit,m:Object.fromEntries(mf(c).map(k=>[k,BASE[k]+i*(k=='legOpening'||k=='width'?1:3)]))})),variants:[],reviews:[{u:'Nada',r:5,t:'Great quality'},{u:'Karim',r:4,t:'Nice fit'}]};
cols.forEach((co,ci)=>sz.forEach((s,i)=>{const sku=bid.toUpperCase()+'-'+id.slice(-2).toUpperCase()+'-'+co[0].slice(0,3).toUpperCase()+'-'+s,stock=(ci+i+off)%5==0?0:(i+off)%4==0?3:10+i*2;p.variants.push({sku,color:co[0],size:s,stock});S.log.push({sku,pid:id,brandId:bid,d:stock,why:'Initial stock',after:stock,date:Date.now()-9e8})}));S.products.push(p)}

['Mango','#7e22ce',[['Satin Midi Skirt','skirts',1399,0,'Regular'],['Tailored Blazer','jackets',3299,15,'Slim'],['Linen Shirt','shirts',1099,0,'Regular']]],
["Levi's",'#4c1d95',[['501 Straight Jeans','jeans',2199,0,'Regular'],['Trucker Jacket','jackets',2999,10,'Regular'],['Vintage Tee','tshirts',699,0,'Oversized']]],
['Bershka','#86198f',[['Cargo Pants','pants',1199,0,'Wide'],['Graphic Sweatshirt','sweatshirts',899,25,'Oversized'],['Mini Dress','dresses',999,0,'Regular']]]];let add=0;
D.forEach((b,i)=>{const id='b'+(4+i);if(S.brands.some(x=>x.id==id))return;add=1;S.brands.push({id,name:b[0],color:b[1],desc:'Discover the latest '+b[0]+' styles on Ma32ol.',status:'Active',rating:+(4+i*.15).toFixed(1),phone:'',email:''});
b[2].forEach((p,k)=>mkp(id,'x'+(4+i)+String.fromCharCode(97+k),p[0],p[1],p[2],p[3],p[4],[K[(i+k)%6],K[(i+k+1)%6],K[(i+k+3)%6]].slice(0,p[1]=='shoes'||p[1]=='skirts'?2:3),SZ(p[1]),i*3+k+1))});if(add)save()}
function bcard(b){return `<div class=card style="padding:0;cursor:pointer" onclick="go('#/brand/${b.id}')"><div class=cover style="background:${cvr(b)}"></div><div class=row style="padding:10px;margin-top:-30px"><div class=bl style="background:${b.color};overflow:hidden">${lgo(b)}</div><div><b>${E(b.name)}</b><div class=m>★ ${b.rating.toFixed(1)} · ${S.products.filter(p=>p.brandId==b.id&&!p.deleted).length} ${t('products','منتج')}</div></div></div></div>`}
function slide(d){const el=$('#sl');if(!el||!el.firstElementChild)return;const w=el.firstElementChild.offsetWidth+12,rtl=S.lang=='ar',mx=el.scrollWidth-el.clientWidth,pos=Math.abs(el.scrollLeft);let n=pos+d*w;if(d>0&&pos>=mx-4)n=0;if(d<0&&pos<=4)n=mx;el.scrollTo({left:(rtl?-1:1)*n,behavior:'smooth'})}
setInterval(()=>{if(!window._sp)slide(1)},3000);
/* ---------- live search (brands + products) ---------- */
function sq(v,k=''){F.q=v;const q=v.trim().toLowerCase(),box=$('#sug'+k);if(!box)return;if(!q){box.style.display='none';box.innerHTML='';return}
const bs=S.brands.filter(b=>b.status=='Active'&&b.name.toLowerCase().includes(q)),
ps=S.products.filter(p=>{const b=brand(p.brandId);return !p.deleted&&b.status=='Active'&&[p.name,b.name,cn(p.cat),cat(p.cat)[1],...p.variants.map(x=>x.sku)].join(' ').toLowerCase().includes(q)}),
hd=x=>`<div class=m style="padding:8px 10px 2px;font-weight:700">${x}</div>`;
box.innerHTML=(bs.length?hd(t('Brands','العلامات'))+bs.slice(0,4).map(b=>`<div class=row style="padding:8px 10px;cursor:pointer" onmousedown="event.preventDefault();sgo('#/brand/${b.id}')"><div class=bl style="width:34px;height:34px;border:0;overflow:hidden;background:${b.color}">${lgo(b)}</div><div><b>${E(b.name)}</b><div class=m>${S.products.filter(p=>p.brandId==b.id&&!p.deleted).length} ${t('products','منتج')}</div></div></div>`).join(''):'')
+(ps.length?hd(t('Products','المنتجات'))+ps.slice(0,6).map(p=>`<div class=row style="padding:8px 10px;cursor:pointer" onmousedown="event.preventDefault();sgo('#/p/${p.id}')"><div class=th style="width:38px">${pimg(p)}</div><div style="flex:1;min-width:0"><b>${E(p.name)}</b><div class=m>${E(brand(p.brandId).name)} · ${cn(p.cat)}</div></div><b>${money(pr(p))}</b></div>`).join(''):'')
+(bs.length||ps.length?`<div class=row style="padding:10px;cursor:pointer;color:var(--p);font-weight:700;border-top:1px solid var(--b)" onmousedown="event.preventDefault();seeAll()">${I('search')}${t('See all results','عرض كل النتائج')} (${bs.length+ps.length})</div>`:`<div class=m style="padding:14px">${t('No brands or products found','لا توجد علامات أو منتجات')}</div>`);box.style.display='block';ic()}
function sgo(h){document.querySelectorAll('#sug,#sug2').forEach(b=>b.style.display='none');F.q='';document.querySelectorAll('#gq,#gq2').forEach(i=>i.value='');go(h)}
function seeAll(){document.querySelectorAll('#sug,#sug2').forEach(b=>b.style.display='none');document.activeElement&&document.activeElement.blur();if(location.hash=='#/'||!location.hash)render();else go('#/')}

function heroB(){const ps=S.products.filter(p=>!p.deleted&&brand(p.brandId).status=='Active').sort((a,b)=>b.date-a.date).slice(0,3);
return `<section class=hero><div><span class=b style="background:#ffffff26;color:#fff">${t('New season · 2026','موسم جديد · 2026')}</span><h1>${t('Fashion from the brands you love.','أزياء من البراندات اللي بتحبها.')}</h1><p>${t('One marketplace. Many brands. Delivered to your door.','سوق واحد. براندات كتير. توصيل لحد بابك.')}</p><div class=row><button class=btn style="background:#fff;color:#4c1d95" onclick="$('#sl').scrollIntoView({behavior:'smooth',block:'center'})">${t('Explore brands','استكشف البراندات')}</button><button class="btn g" style="color:#fff;border-color:#ffffff80" onclick="F.disc=1;render()">${t('Shop deals','شوف العروض')}</button></div></div><div class=hp>${ps.map((p,i)=>`<div class="hpc c${i}" onclick="go('#/p/${p.id}')">${pimg(p)}<b style="display:block;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${E(p.name)}</b><span class=m>${money(pr(p))}</span></div>`).join('')}</div></section>`}
const trust=()=>`<div class=trust>${[['truck',t('Fast delivery','توصيل سريع'),t('To your door','لحد بابك')],['rotate-ccw',t('Easy returns','استرجاع سهل'),t('Hassle-free','بدون تعقيد')],['shield-check',t('Secure checkout','دفع آمن'),t('Card or cash','بطاقة أو كاش')],['badge-check',t('Trusted brands','براندات موثوقة'),t('Approved by Ma32ol','معتمدة من Ma32ol')]].map(x=>`<div class="card stat" style="padding:10px">${I(x[0])}<div><b style="font-size:13px">${x[1]}</b><span class=m>${x[2]}</span></div></div>`).join('')}</div>`;

function admin(){const live_=S.orders.filter(live),rev=live_.reduce((a,o)=>a+o.total,0);
return `<main><h2>${t('Platform admin','إدارة المنصة')}</h2><div class=stats>${[['store',t('Brands','العلامات'),S.brands.length],['wallet',t('Marketplace sales','مبيعات السوق'),money(rev)],['percent',t('Commission (10%)','العمولة (10%)'),money(rev*.1)],['package',t('All orders','كل الطلبات'),S.orders.length],['shirt',t('Products','المنتجات'),S.products.filter(p=>!p.deleted).length]].map(c=>`<div class="card stat">${I(c[0])}<div><span class=m>${c[1]}</span><b>${c[2]}</b></div></div>`).join('')}</div>
